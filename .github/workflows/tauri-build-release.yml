name: Tauri Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Tauri
        run: npm run tauri build

      - name: Create portable
        shell: pwsh
        run: |
          # 寻找生成的 exe（可能是 app.exe 或 cursor-manager.exe）
          $exe = Get-ChildItem -Path "src-tauri\target\release\*.exe" | Where-Object { $_.Name -match "^app\.exe$" -or $_.Name -match "^cursor-manager\.exe$" } | Select-Object -First 1
          if ($exe) {
              $mb = [math]::Round($exe.Length / 1MB, 2)
              Write-Host "Found portable executable: $($exe.Name), Size: $mb MB"
              New-Item -Force -Type Directory "dist-portable" | Out-Null
              Copy-Item $exe.FullName "dist-portable\Cursor续杯_portable.exe"
          } else {
              Write-Host "::error::Could not find executable for portable version"
              exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist-portable/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm install
      - run: npm run tauri build -- --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm install
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Get version
        id: ver
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: Prepare
        run: |
          mkdir release
          
          # Windows portable
          find artifacts/windows -name "Cursor续杯_portable.exe" -exec cp {} "release/Cursor续杯_${{ steps.ver.outputs.version }}_portable.exe" \; -quit 2>/dev/null || true
          
          # Windows NSIS
          find artifacts/windows -name "*.exe" ! -name "*portable*" -exec cp {} "release/Cursor续杯_${{ steps.ver.outputs.version }}_setup.exe" \; -quit 2>/dev/null || true
          
          # Windows MSI
          find artifacts/windows -name "*.msi" -exec cp {} "release/Cursor续杯_${{ steps.ver.outputs.version }}.msi" \; -quit 2>/dev/null || true
          
          # macOS
          find artifacts/macos-x86_64-apple-darwin -name "*.dmg" -exec cp {} "release/Cursor续杯_${{ steps.ver.outputs.version }}_macos_x64.dmg" \; -quit 2>/dev/null || true
          find artifacts/macos-aarch64-apple-darwin -name "*.dmg" -exec cp {} "release/Cursor续杯_${{ steps.ver.outputs.version }}_macos_arm64.dmg" \; -quit 2>/dev/null || true
          
          # Linux
          find artifacts/linux -name "*.AppImage" -exec cp {} "release/Cursor续杯_${{ steps.ver.outputs.version }}_linux.AppImage" \; -quit 2>/dev/null || true
          
          ls -lh release/
          
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body: |
            ## Cursor续杯 ${{ steps.ver.outputs.version }}
            
            ### Windows (推荐便携版)
            - `xxx_portable.exe` - 便携版 (~20MB) 双击即用 ⭐
            - `xxx_setup.exe` - 安装版 (~5MB)
            
            ### macOS
            - `xxx_macos_x64.dmg` - Intel
            - `xxx_macos_arm64.dmg` - Apple Silicon
            
            ### Linux
            - `xxx_linux.AppImage` - AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
